<!doctype html>

  <title>Qué se sancionó en diputaciones federales 2024</title>
  <style>
    @page { size: letter landscape; margin: 0; }
    * { box-sizing: border-box; }
    html { background: #d8d3cc; }
    body {
      margin: 0;
      color: #211816;
      font-family: Montserrat, Avenir, Helvetica, Arial, sans-serif;
    }
    .report-page {
      width: 11in;
      height: 8.5in;
      margin: 24px auto;
      overflow: hidden;
      background: #fff;

      page-break-after: always;
    }

    }
    .report-page img {
      display: block;
      width: 11in;
      height: 8.5in;
      object-fit: contain;
    }
    .download-pdf {
      position: fixed;
      z-index: 1000;
      top: 18px;
      right: 18px;
      display: inline-flex;
      align-items: center;
      padding: 12px 17px;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 999px;
      background: #6B1531;
      color: #fff;
      box-shadow: 0 8px 24px rgba(33, 24, 22, .25);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .02em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .download-pdf:hover { background: #3b0718; }
    @media print {
      html, body { background: #fff; }
      .download-pdf { display: none !important; }
      .report-page {
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
